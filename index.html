<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#33200F">
  <title>Los Concentrados y Algo Más</title>

  <!-- Fuentes: Figtree (UI) + Fredoka (marca/títulos) + Caveat ("y algo más")
       + Inter/JetBrains Mono (aún usadas en plantillas de impresión) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&family=Caveat:wght@700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Iconos Lucide (los iconitos de la app) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SheetJS para exportar/importar Excel (.xlsx, .xls, .csv) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <!-- Contenedor raíz de la app. El JS inyecta todo el contenido acá. -->
  <div id="app">
    <!-- Splash inicial: lo que se ve los primeros milisegundos
         mientras carga el JavaScript. Inline a propósito para que
         aparezca de inmediato sin esperar CSS externo. -->
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Figtree,system-ui,sans-serif;color:#5C4636;font-size:15px;background:#FAF6EF">
      <div style="text-align:center">
        <img src="/favicon.svg" width="64" height="64" alt="" style="display:block;margin:0 auto 12px">
        <div>Cargando…</div>
      </div>
    </div>
  </div>

  <!-- Punto de entrada del JavaScript. Vite resuelve la ruta /src/main.js -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
